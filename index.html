<!-- MODAL DE AUTENTICAÇÃO E CADASTRO CYBERPUNK -->
<div class="modal-overlay" id="modalLogin" style="display:flex;">
    <div class="cyber-modal">
        <h3 id="tituloAuth" style="text-align: center; color: #00f0ff; margin-top: 0;">🔐 AUTENTICAÇÃO OBRIGATÓRIA</h3>
        <p id="subtituloAuth" style="text-align: center; font-size: 0.8em; color: #8b949e;">Entre com sua conta ou faça seu cadastro inicial</p>
        
        <!-- FORMULÁRIO DE LOGIN -->
        <div id="formLoginBox">
            <label>Celular ou E-mail:</label>
            <input type="text" id="loginUser" placeholder="ex: 11999990000 ou doni@etec.sp.gov.br">
            
            <label>Senha de Acesso:</label>
            <input type="password" id="loginPass" placeholder="••••••••">
            
            <button class="btn-cyber-primary" onclick="conectarComSenha()">CONECTAR COM SENHA ⚡</button>
            <button class="btn-cyber-guest" onclick="alternarTelaAuth('cadastro')">📝 NÃO TEM CONTA? CADASTRE-SE</button>
            <button class="btn-cyber-guest" style="border-color:#00f0ff; color:#00f0ff;" onclick="autenticar('visitante')">👤 TESTAR MODO VISITANTE (TCC DEMO)</button>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div id="formCadastroBox" style="display:none;">
            <label>Nome / Apelido:</label>
            <input type="text" id="cadNome" placeholder="ex: Donizete">

            <label>Celular ou E-mail:</label>
            <input type="text" id="cadUser" placeholder="ex: 11999990000">
            
            <label>Crie uma Senha:</label>
            <input type="password" id="cadPass" placeholder="••••••••">

            <label>Confirme a Senha:</label>
            <input type="password" id="cadPassConf" placeholder="••••••••">
            
            <button class="btn-cyber-primary" onclick="realizarCadastro()">FINALIZAR CADASTRO E GERAR CHAVE ⚡</button>
            <button class="btn-cyber-guest" onclick="alternarTelaAuth('login')">⬅️ VOLTAR PARA O LOGIN</button>
        </div>
    </div>
</div>

<script>
// BANCO DE DADOS TEMPORÁRIO (SIMULAÇÃO)
let usuarioCadastrado = null;
let senhaCadastrada = null;

function alternarTelaAuth(tela) {
    if(tela === 'cadastro') {
        document.getElementById('formLoginBox').style.display = 'none';
        document.getElementById('formCadastroBox').style.display = 'block';
        document.getElementById('tituloAuth').innerText = '📝 CADASTRO DE USUÁRIO';
        document.getElementById('subtituloAuth').innerText = 'Registre suas credenciais para liberar o acesso';
    } else {
        document.getElementById('formCadastroBox').style.display = 'none';
        document.getElementById('formLoginBox').style.display = 'block';
        document.getElementById('tituloAuth').innerText = '🔐 AUTENTICAÇÃO OBRIGATÓRIA';
        document.getElementById('subtituloAuth').innerText = 'Entre com sua conta ou utilize o modo de testes';
    }
}

function realizarCadastro() {
    const nome = document.getElementById('cadNome').value.trim();
    const user = document.getElementById('cadUser').value.trim();
    const pass = document.getElementById('cadPass').value.trim();
    const passConf = document.getElementById('cadPassConf').value.trim();

    if (!user || !pass) {
        alert("⚠️ Por favor, preencha o e-mail/celular e a senha para se cadastrar.");
        return;
    }

    if (pass !== passConf) {
        alert("⚠️ As senhas digitadas não coincidem. Digite novamente.");
        return;
    }

    usuarioCadastrado = user;
    senhaCadastrada = pass;

    alert("✅ Cadastro efetuado com sucesso! Agora informe seu usuário e senha na tela de login.");
    
    // Preenche o login automaticamente e volta para a tela inicial
    document.getElementById('loginUser').value = user;
    document.getElementById('loginPass').value = '';
    alternarTelaAuth('login');
}

function conectarComSenha() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();

    if (!user || !pass) {
        alert("⚠️ Digite o e-mail/celular e a senha para entrar.");
        return;
    }

    // Se a pessoa já se cadastrou, valida os dados
    if (usuarioCadastrado) {
        if (user === usuarioCadastrado && pass === senhaCadastrada) {
            autenticar('comum', user);
        } else {
            alert("❌ Usuário ou senha incorretos! Verifique os dados cadastrados.");
        }
    } else {
        // Se ainda não se cadastrou
        alert("⚠️ Nenhuma conta foi cadastrada ainda neste navegador! Clique em 'NÃO TEM CONTA? CADASTRE-SE' para criar a sua senha.");
    }
}

function autenticar(tipo, nomeUser = '') {
    const display = document.getElementById('displaySessao');
    
    if (tipo === 'visitante') {
        display.innerText = "👤 Status: Modo Visitante (TCC Demo)";
    } else {
        display.innerText = "⚡ Usuário Conectado: " + (nomeUser || "Donizete");
    }

    document.getElementById('painelTopo').style.display = 'flex';
    document.getElementById('painelConteudo').style.display = 'block';
    fecharModal('modalLogin');
}
</script>
